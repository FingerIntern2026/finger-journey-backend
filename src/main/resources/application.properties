spring.application.name=finger-journey-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# finger-journey-ai(FastAPI) 서버 주소 — AI 완주 리포트 생성 시 내부적으로 호출
ai.server.base-url=http://localhost:8000

# JWT: Base64 인코딩된 비밀키는 .env의 JWT_SECRET으로 관리
jwt.secret=${JWT_SECRET}
# 관리자 API(/admin/**) 권한 검사: 프론트가 토큰을 보내기 전까지는 false, 로그인 연동 후 true로 바꾼다.
app.admin-auth.enabled=${ADMIN_AUTH_ENABLED:false}

# 관리자 이미지 업로드: 파일은 이 폴더에 저장하고 /media/{파일명}으로 내려준다. (용량은 5MB까지)
app.media.upload-dir=${MEDIA_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# 유효 시간(초): 팀 합의 전 임시값, 환경변수로 변경 가능
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
